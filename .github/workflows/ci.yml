name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install gcc (the sandbox compiles student code)
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev util-linux
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest
      - name: Build the Docker image
        run: docker build -t iiserb-c-quiz-evaluator .
